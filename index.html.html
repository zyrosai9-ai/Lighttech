<!DOCTYPE html>
<html lang="mn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightTech 3D — Компьютер ба Процессорын Интерактив Задаргаа</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 42% 45%, #0f1b33 0%, #060b16 70%, #02040a 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }
    #canvas-container:active { cursor: grabbing; }

    .glass-bar {
      background: rgba(9, 15, 29, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .glass-slide {
      background: linear-gradient(145deg, rgba(11, 19, 36, 0.88) 0%, rgba(6, 11, 22, 0.94) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 32px rgba(6, 182, 212, 0.1);
    }

    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
      cursor: pointer;
      margin-top: -7px;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.18); }

    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-animate { animation: slideFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.35); border-radius: 999px; }
  </style>
</head>
<body>

  <!-- 3D WEBGL VIEWPORT -->
  <div id="canvas-container"></div>

  <!-- FLOATING HOVER TOOLTIP -->
  <div id="hover-tooltip" class="fixed z-40 pointer-events-none hidden transform -translate-x-1/2 -translate-y-full pb-3">
    <div class="glass-bar px-3 py-1.5 rounded-xl border border-sky-400/60 flex items-center gap-2 whitespace-nowrap">
      <span id="tooltip-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
      <span id="tooltip-text" class="text-xs font-bold text-white">Процессор (CPU)</span>
      <span class="text-[10px] mono text-sky-300">(Дарж үзэх)</span>
    </div>
  </div>

  <!-- TOP MINIMAL HUD BAR -->
  <header class="fixed top-3 sm:top-4 left-3 sm:left-4 right-3 sm:right-4 z-30 pointer-events-none">
    <div class="max-w-[1660px] mx-auto flex flex-wrap items-center justify-between gap-2.5">
      
      <!-- Brand Identity -->
      <div class="pointer-events-auto glass-bar px-3.5 py-2 rounded-2xl flex items-center gap-3 cursor-pointer" onclick="resetCameraView()">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 via-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
          <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold tracking-tight text-base sm:text-lg text-white">Light<span class="text-cyan-400">Tech</span></span>
            <span class="text-[10px] mono font-bold px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">3D LAB</span>
          </div>
          <p class="text-[10px] text-slate-400 hidden sm:block leading-none mt-0.5">Интерактив Техник Хангамжийн Задаргаа</p>
        </div>
      </div>

      <!-- 3 Mode Switcher Tabs -->
      <nav class="pointer-events-auto glass-bar p-1 rounded-2xl flex items-center gap-1 overflow-x-auto max-w-full">
        <button onclick="switchMode('pc')" id="tab-pc" class="mode-tab px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 shadow-md shadow-cyan-500/25">
          1. 3D Компьютер & Кэйс
        </button>
        <button onclick="switchMode('cpu')" id="tab-cpu" class="mode-tab px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all text-slate-300 hover:text-white hover:bg-slate-800/70">
          2. 3D Процессор (8 Давхарга)
        </button>
        <button onclick="switchMode('arch')" id="tab-arch" class="mode-tab px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all text-slate-300 hover:text-white hover:bg-slate-800/70">
          3. Архитектур & Төрөл
        </button>
      </nav>

      <!-- Signal Flow & Camera Reset -->
      <div class="pointer-events-auto glass-bar px-3 py-2 rounded-2xl flex items-center gap-2">
        <button onclick="toggleDataPulse()" id="btn-pulse" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 text-xs font-semibold hover:bg-emerald-500/30 transition" title="Дохионы урсгал">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Урсгал</span>
        </button>
        <button onclick="resetCameraView()" class="p-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition" title="Камер тэгшлэх">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- RESTORE BUTTON (WHEN SLIDE DRAWER IS COLLAPSED) -->
  <button onclick="toggleSlideDrawer(true)" id="btn-restore-drawer" class="hidden fixed right-4 top-20 z-30 glass-bar px-4 py-2.5 rounded-2xl border border-cyan-400/50 text-xs sm:text-sm font-bold text-cyan-300 hover:bg-cyan-500/20 flex items-center gap-2 shadow-xl transition-all">
    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
    <span>Тайлбар нээх</span>
  </button>

  <!-- RIGHT-EDGE COLLAPSIBLE SLIDE EXPLANATION DRAWER -->
  <aside id="slide-drawer" class="fixed right-3 sm:right-4 top-20 bottom-16 w-[calc(100vw-24px)] sm:w-80 md:w-[370px] z-30 pointer-events-none flex flex-col justify-start transition-all duration-300">
    <div class="pointer-events-auto glass-slide rounded-3xl p-4 sm:p-5 max-h-full flex flex-col overflow-hidden">
      
      <!-- Top Controls: Slide Counter, Auto-Tour, Minimize -->
      <div class="flex items-center justify-between gap-2 pb-2.5 mb-2.5 border-b border-slate-700/60 shrink-0">
        <div class="flex items-center gap-2">
          <span id="slide-counter" class="mono text-[11px] font-bold px-2 py-0.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">
            SLIDE 1 / 8
          </span>
          <button onclick="toggleAutoTour()" id="btn-autotour" class="px-2.5 py-1 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-600/70 text-[11px] font-bold flex items-center gap-1 transition">
            <svg class="w-3 h-3 text-cyan-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span id="autotour-text">Auto-Tour</span>
          </button>
        </div>

        <button onclick="toggleSlideDrawer(false)" class="px-2.5 py-1 rounded-xl bg-slate-800/90 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 border border-slate-700 hover:border-rose-400/40 text-[11px] font-semibold flex items-center gap-1 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
          <span>Хураах</span>
        </button>
      </div>

      <!-- Slide Dots -->
      <div id="slide-dots" class="flex items-center gap-1.5 pb-2.5 shrink-0"></div>

      <!-- Scrollable Slide Content -->
      <div id="slide-content-area" class="flex-1 overflow-y-auto pr-1 space-y-3 slide-animate">
        <div>
          <div class="flex items-center gap-2">
            <span id="slide-color-swatch" class="w-3 h-3 rounded-full bg-cyan-400 shrink-0"></span>
            <span id="slide-badge" class="text-[10px] font-bold uppercase tracking-wider text-amber-300 block">
              БҮРЭН СИСТЕМ
            </span>
          </div>
          <h2 id="slide-title" class="text-base sm:text-lg font-extrabold text-white tracking-tight mt-1 leading-snug">
            Шилэн Кэйс ба Бүрэн Компьютер
          </h2>
          <span id="slide-subtitle" class="mono text-[11px] text-cyan-400 block mt-0.5">
            Tempered Glass Dual-Chamber PC
          </span>
        </div>

        <p id="slide-desc" class="text-xs sm:text-[13px] text-slate-300 leading-relaxed"></p>

        <!-- Working Principle Box -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-2.5">
          <div class="text-[10px] font-bold uppercase tracking-wider text-cyan-400 mb-1">Ажиллах зарчим</div>
          <p id="slide-how" class="text-xs text-slate-300 leading-relaxed"></p>
        </div>

        <!-- CPU Color-Coded Quick Selector (Visible in CPU Mode) -->
        <div id="cpu-color-legend" class="hidden bg-slate-900/90 border border-slate-700/70 rounded-2xl p-2.5">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Процессорын Өнгөний Түлхүүр (Дарж сонгоно уу)</div>
          <div id="legend-items" class="grid grid-cols-2 gap-1"></div>
        </div>

        <!-- Technical Specs Grid -->
        <div id="slide-specs" class="grid grid-cols-2 gap-1.5 pt-0.5"></div>
      </div>

      <!-- Bottom Slide Navigation -->
      <div class="flex items-center justify-between gap-2 pt-3 mt-3 border-t border-slate-700/60 shrink-0">
        <button onclick="prevSlide()" class="flex-1 py-2 px-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold flex items-center justify-center gap-1.5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          <span>Өмнөх</span>
        </button>
        <button onclick="nextSlide()" class="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 hover:brightness-110 text-slate-950 text-xs font-extrabold flex items-center justify-center gap-1.5 shadow-md shadow-cyan-500/20 transition">
          <span>Дараагийнх</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

    </div>
  </aside>

  <!-- BOTTOM COMPACT FLOATING EXPLODE & SLIDE DOCK -->
  <footer class="fixed bottom-3 left-3 sm:left-4 z-30 pointer-events-none">
    <div class="pointer-events-auto glass-bar px-3.5 py-2 rounded-2xl flex items-center gap-3 shadow-xl">
      <button onclick="toggleExplode()" id="btn-explode" class="px-3 py-1.5 rounded-xl bg-cyan-500/25 hover:bg-cyan-500/35 text-cyan-300 border border-cyan-400/40 text-xs font-bold whitespace-nowrap transition">
        Задлах
      </button>
      <div class="flex items-center gap-2 w-28 sm:w-40">
        <input type="range" id="explode-slider" min="0" max="100" value="0" oninput="setExplodePercent(this.value)" class="w-full" />
        <span id="explode-label" class="mono text-[11px] text-cyan-300 w-8 text-right font-bold">0%</span>
      </div>
      <div class="h-4 w-[1px] bg-slate-700/80"></div>
      <div class="flex items-center gap-1">
        <button onclick="prevSlide()" class="p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 transition" title="Өмнөх слайд">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button onclick="nextSlide()" class="p-1.5 rounded-xl bg-cyan-500/25 hover:bg-cyan-500/40 text-cyan-300 border border-cyan-400/40 transition" title="Дараагийн слайд">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <script>
    // =========================================================================
    // 1. EDUCATIONAL SLIDE DATABASE (MONGOLIAN CYRILLIC)
    // =========================================================================
    const SLIDE_DECKS = {
      pc: [
        {
          partId: 'case',
          color: '#06b6d4',
          badge: '1 / 8 • ГАДНА ИХ БИЕ & ХӨРГӨЛТ',
          title: 'Шилэн Кэйс ба RGB Infinity Сэнснүүд',
          subtitle: 'Tempered Glass Dual-Chamber Case',
          desc: 'Урд болон хажуу талдаа 4мм зузаан хатууруулсан шилтэй (Tempered Glass) орчин үеийн кэйс. Доторх эд ангиудыг тоос шорооноос хамгаална.',
          how: 'Доод болон хажуугийн RGB сэнснүүд хүйтэн агаарыг дотогш татаж, дээд талын радиатороор халуун агаарыг гадагшлуулна.',
          specs: [
            { k: 'Шил', v: '4mm Tempered Glass' },

            { k: 'Агаарын урсгал', v: 'Доороос дээш' }
          ],
          explodeTarget: 0.25,
          cam: { theta: 0.68, phi: 1.05, radius: 13.5, lookAt: [0, 2.2, 0] }
        },
        {
          partId: 'motherboard',
          color: '#0284c7',
          badge: '2 / 8 • ҮНДСЭН ХОЛБОГЧ ХАВТАН',
          title: 'Эх хавтан (Motherboard)',
          subtitle: 'Multi-Layer ATX Printed Circuit Board',
          desc: 'Компьютерийн CPU, RAM, GPU, SSD болон тэжээлийн блокийг хооронд нь холбодог олон давхаргат үндсэн хавтан.',
          how: 'Зэс дамжуулагч замууд болон VRM хүчдэл тогтворжуулагчийн тусламжтайгаар секундэд хэдэн арван гигабайт өгөгдөл дамжуулна.',

        {

          how: 'Санах ойгоос заавар татаж (Fetch), тайлж (Decode), гүйцэтгэх (Execute) циклийг тасралтгүй гүйцэтгэнэ. Дээд талын 2-р табаас 8 давхаргаар нь задалж үзээрэй!',
          specs: [
            { k: 'Цөм', v: '24 Cores / 32 Threads' },
            { k: 'Хурд', v: '5.8 GHz Boost' },
            { k: 'Кэш', v: '36MB–96MB Smart Cache' },
            { k: 'Литографи', v: '3nm EUV Silicon' }
          ],
          explodeTarget: 0.85,
          cam: { theta: 0.35, phi: 1.18, radius: 6.2, lookAt: [-0.5, 2.85, -0.8] }

        {
          partId: 'aio',
          color: '#22d3ee',
          badge: '4 / 8 • ШИНГЭН ХӨРГҮҮР (LCD)',
          title: 'LCD Дэлгэцтэй Шингэн Хөргүүр (AIO)',
          subtitle: '360mm Liquid Cooler with 46°C Display',
          desc: 'Процессорын дулааныг зэс усан блокоор шингээж, хоолойгоор дамжуулан дээд талын радиатор руу зөөн хөргөнө. Дэлгэц дээр CPU температур (46°C) харагдана.',
          how: 'Шахуурга (Pump) хөргөх шингэнийг тасралтгүй эргэлдүүлж, радиаторын сэнснүүд дулааныг гадагш үлээнэ.',
          specs: [
            { k: 'Температур', v: '46°C (Бодит цаг)' },
            { k: 'Радиатор', v: '360mm Хөнгөн цагаан' },

          ],

        },
        {

          explodeTarget: 0.85,
          cam: { theta: 0.65, phi: 1.12, radius: 6.8, lookAt: [0.8, 2.9, -0.3] }
        },
        {
          partId: 'gpu',
          color: '#38bdf8',
          badge: '6 / 8 • ДҮРС БА AI ХУРДАСГУУР',

    // =========================================================================
    // 2. PROCEDURAL PBR TEXTURES
    // =========================================================================
    function createPcbTexture(baseHex = '#0a1220', traceHex = '#0ea5e9') {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = traceHex;
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 80; i++) {
        let x = (i * 23) % 512;
        let y = (i * 41) % 512;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 50, y);
        ctx.lineTo(x + 75, y + 25);
        ctx.lineTo(x + 150, y + 25);
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createIhsBrushedTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#e2e8f0');
      grad.addColorStop(0.5, '#cbd5e1');
      grad.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      for (let y = 0; y < 512; y += 2) {
        ctx.fillStyle = y % 4 === 0 ? 'rgba(255,255,255,0.14)' : 'rgba(15,23,42,0.06)';
        ctx.fillRect(0, y, 512, 1);
      }

      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.font = 'bold 38px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LIGHTTECH', 256, 215);
      ctx.font = '700 26px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(2, 132, 199, 0.95)';
      ctx.fillText('CORE ULTRA 9 • 3nm', 256, 260);
      ctx.font = '500 15px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(30, 41, 59, 0.75)';
      ctx.fillText('S/N: LT-2026-8LAYER-X64', 256, 305);

      return new THREE.CanvasTexture(canvas);
    }

    function createIridescentSiliconTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#090d1a');
      grad.addColorStop(0.4, '#1e1b4b');
      grad.addColorStop(0.8, '#0c4a6e');
      grad.addColorStop(1, '#111827');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const colors = ['rgba(56, 189, 248, 0.25)', 'rgba(168, 85, 247, 0.22)', 'rgba(16, 185, 129, 0.22)', 'rgba(245, 158, 11, 0.2)'];
      for (let i = 0; i < 160; i++) {
        const x = (i * 37) % 480;
        const y = (i * 53) % 480;
        const w = 16 + (i % 5) * 14;
        const h = 10 + (i % 4) * 10;
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.35)';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(x, y, w, h);
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createAioLcdTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(128, 128, 102, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 76px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('46°', 132, 146);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 18px "JetBrains Mono", monospace';
      ctx.fillText('CPU TEMP', 128, 182);

      return new THREE.CanvasTexture(canvas);
    }

    // =========================================================================
    const orbit = {
      theta: 0.68,
      phi: 1.05,
      radius: 13.5,
      lookAt: new THREE.Vector3(0, 2.2, 0),
      targetTheta: 0.68,
      targetPhi: 1.05,
      targetRadius: 13.5,
      targetLookAt: new THREE.Vector3(0, 2.2, 0),
      isDragging: false,
      isPanning: false,
      prevX: 0,
      prevY: 0,
      updateCamera(camera) {
        this.theta += (this.targetTheta - this.theta) * 0.1;
        this.phi += (this.targetPhi - this.phi) * 0.1;
        this.radius += (this.targetRadius - this.radius) * 0.1;
        this.lookAt.lerp(this.targetLookAt, 0.1);

        const sinPhi = Math.sin(this.phi);
        const x = this.lookAt.x + this.radius * sinPhi * Math.sin(this.theta);
        const y = this.lookAt.y + this.radius * Math.cos(this.phi);
        const z = this.lookAt.z + this.radius * sinPhi * Math.cos(this.theta);
        camera.position.set(x, y, z);
        camera.lookAt(this.lookAt);
      }
    };

    function registerPart(list, group, partId, basePos, explodeVec) {
      group.position.copy(basePos);

          child.castShadow = true;

    function createInfinityFan(radius = 0.56) {
      const fanGroup = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: '#0f172a', metalness: 0.8, roughness: 0.25 });
      const frame = new THREE.Mesh(new THREE.BoxGeometry(radius * 2.15, radius * 2.15, 0.24), frameMat);
      fanGroup.add(frame);

      const neonMat = new THREE.MeshStandardMaterial({ color: '#06b6d4', emissive: '#06b6d4', emissiveIntensity: 2.0 });
      const ring = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.92, 0.032, 12, 32), neonMat);
      ring.position.z = 0.13;
      fanGroup.add(ring);

      const rotor = new THREE.Group();
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.32, radius * 0.32, 0.14, 20), neonMat);
      hub.rotation.x = Math.PI / 2;
      rotor.add(hub);

      const bladeMat = new THREE.MeshStandardMaterial({ color: '#e0f2fe', emissive: '#0284c7', emissiveIntensity: 0.4, roughness: 0.2 });
      for (let i = 0; i < 7; i++) {
        const ang = (i / 7) * Math.PI * 2;
        const blade = new THREE.Mesh(new THREE.BoxGeometry(radius * 0.68, 0.14, 0.02), bladeMat);
        blade.position.set(Math.cos(ang) * radius * 0.54, Math.sin(ang) * radius * 0.54, 0);
        blade.rotation.z = ang;
        blade.rotation.x = 0.42;
        rotor.add(blade);
      }
      rotor.position.z = 0.05;
      fanGroup.add(rotor);
      spinningFans.push({ mesh: rotor, axis: 'z', speed: 9 });
      return fanGroup;
    }

    // =========================================================================
    // 8. SLIDE NAVIGATION, MODE SWITCHING & AUTO-TOUR
    // =========================================================================
    function switchMode(mode) {
      currentMode = mode;
      pcGroup.visible = (mode === 'pc');
      cpuGroup.visible = (mode === 'cpu');
      archGroup.visible = (mode === 'arch');

      document.querySelectorAll('.mode-tab').forEach(btn => {
        btn.className = 'mode-tab px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all text-slate-300 hover:text-white hover:bg-slate-800/70';
      });
      const active = document.getElementById(`tab-${mode}`);
      if (active) {
        active.className = 'mode-tab px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 shadow-md shadow-cyan-500/25';
      }

      goToSlide(0);
    }

    function goToSlide(index) {
      const deck = SLIDE_DECKS[currentMode];
      if (!deck) return;
      currentSlideIdx = ((index % deck.length) + deck.length) % deck.length;
      const slide = deck[currentSlideIdx];

      document.getElementById('slide-counter').textContent = `SLIDE ${currentSlideIdx + 1} / ${deck.length}`;
      document.getElementById('slide-badge').textContent = slide.badge;

      const swatch = document.getElementById('slide-color-swatch');
      if (slide.color) {
        swatch.style.backgroundColor = slide.color;
        swatch.style.boxShadow = `0 0 10px ${slide.color}`;
        swatch.classList.remove('hidden');
      } else {
        swatch.classList.add('hidden');
      }

      // Show Interactive Color Legend inside Drawer when in CPU mode
      const legendBox = document.getElementById('cpu-color-legend');
      if (currentMode === 'cpu') {
        legendBox.classList.remove('hidden');
        document.getElementById('legend-items').innerHTML = deck.map((item, idx) => `
          <button onclick="goToSlide(${idx})" class="flex items-center gap-1.5 px-2 py-1 rounded-lg text-left text-[10px] transition ${idx === currentSlideIdx ? 'bg-cyan-500/25 border border-cyan-400/60 text-white font-bold' : 'bg-slate-800/70 hover:bg-slate-800 text-slate-300 border border-transparent'}">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${item.color || '#38bdf8'}"></span>
            <span class="truncate">${item.title.replace(/^\d+[A-Z]?\.\s*/, '')}</span>
          </button>
        `).join('');
      } else {
        legendBox.classList.add('hidden');
      }

      document.getElementById('slide-dots').innerHTML = deck.map((_, idx) => `
        <button onclick="goToSlide(${idx})" class="h-1.5 rounded-full transition-all ${idx === currentSlideIdx ? 'w-6 bg-cyan-400' : 'w-2 bg-slate-600 hover:bg-slate-400'}" title="Slide ${idx + 1}"></button>
      `).join('');

      const contentArea = document.getElementById('slide-content-area');
      contentArea.classList.remove('slide-animate');
      void contentArea.offsetWidth;
      contentArea.classList.add('slide-animate');

      document.getElementById('slide-title').textContent = slide.title;
      document.getElementById('slide-subtitle').textContent = slide.subtitle;
      document.getElementById('slide-desc').textContent = slide.desc;
      document.getElementById('slide-how').textContent = slide.how;

      document.getElementById('slide-specs').innerHTML = slide.specs.map(s => `
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-2.5 py-1.5">
          <div class="text-[10px] text-slate-400 leading-none">${s.k}</div>
          <div class="mono text-[11px] font-bold text-cyan-300 mt-1 truncate">${s.v}</div>
        </div>
      `).join('');

      highlightActiveMesh(slide.partId);

      setExplodePercent(Math.round(slide.explodeTarget * 100));
      const rightOffset = (isDrawerOpen && window.innerWidth >= 768) ? 1.15 : 0;
      orbit.targetTheta = slide.cam.theta;
      orbit.targetPhi = slide.cam.phi;
      orbit.targetRadius = slide.cam.radius;
      orbit.targetLookAt.set(slide.cam.lookAt[0] + rightOffset, slide.cam.lookAt[1], slide.cam.lookAt[2]);
    }

    function highlightActiveMesh(activePartId) {
      clickableMeshes.forEach(mesh => {
        if (!mesh.material || !mesh.material.emissive) return;
        if (mesh.userData.origEmissiveIntensity === undefined) {
          mesh.userData.origEmissiveIntensity = mesh.material.emissiveIntensity;
        }
        if (mesh.userData.partId === activePartId) {
          mesh.material.emissiveIntensity = Math.max(1.15, mesh.userData.origEmissiveIntensity * 2.1);
        } else {
          mesh.material.emissiveIntensity = mesh.userData.origEmissiveIntensity;
        }
      });
    }

    function toggleSlideDrawer(open) {
      isDrawerOpen = open;
      const drawer = document.getElementById('slide-drawer');
      const restoreBtn = document.getElementById('btn-restore-drawer');
      if (open) {
        drawer.classList.remove('hidden');
        restoreBtn.classList.add('hidden');
      } else {
        drawer.classList.add('hidden');
        restoreBtn.classList.remove('hidden');
      }
      const deck = SLIDE_DECKS[currentMode];
      if (deck && deck[currentSlideIdx]) {
        const slide = deck[currentSlideIdx];
        const rightOffset = (isDrawerOpen && window.innerWidth >= 768) ? 1.15 : 0;
        orbit.targetLookAt.set(slide.cam.lookAt[0] + rightOffset, slide.cam.lookAt[1], slide.cam.lookAt[2]);
      }
    }

    function nextSlide() { goToSlide(currentSlideIdx + 1); }
    function prevSlide() { goToSlide(currentSlideIdx - 1); }

    function toggleAutoTour() {
      autoTourActive = !autoTourActive;
      autoTourTimer = 0;
      const btn = document.getElementById('btn-autotour');
      const txt = document.getElementById('autotour-text');
      if (autoTourActive) {
        btn.classList.remove('bg-slate-800/90', 'text-slate-200', 'border-slate-600/70');
        btn.classList.add('bg-cyan-500/25', 'text-cyan-300', 'border-cyan-400');
        txt.textContent = 'Зогсоох';
      } else {
        btn.classList.remove('bg-cyan-500/25', 'text-cyan-300', 'border-cyan-400');
        btn.classList.add('bg-slate-800/90', 'text-slate-200', 'border-slate-600/70');
        txt.textContent = 'Auto-Tour';
      }
    }

    // =========================================================================
    // 9. EXPLODE, DATA PULSE, POINTER ORBIT & RAYCASTING CONTROLS
    // =========================================================================
    function setExplodePercent(pct) {
      const clamped = Math.max(0, Math.min(100, Number(pct)));
      targetExplode = clamped / 100;
      document.getElementById('explode-slider').value = clamped;
      document.getElementById('explode-label').textContent = `${clamped}%`;
      document.getElementById('btn-explode').textContent = clamped > 15 ? 'Угсрах' : 'Задлах';
    }

    function toggleExplode() {
      setExplodePercent(targetExplode > 0.15 ? 0 : 100);
    }

    function toggleDataPulse() {
      showDataPulse = !showDataPulse;
      document.getElementById('btn-pulse').style.opacity = showDataPulse ? '1' : '0.45';
    }

    function resetCameraView() {
      const deck = SLIDE_DECKS[currentMode];
      if (deck && deck[currentSlideIdx]) {
        const slide = deck[currentSlideIdx];
        const rightOffset = (isDrawerOpen && window.innerWidth >= 768) ? 1.15 : 0;
        orbit.targetTheta = slide.cam.theta;
        orbit.targetPhi = slide.cam.phi;
        orbit.targetRadius = slide.cam.radius;
        orbit.targetLookAt.set(slide.cam.lookAt[0] + rightOffset, slide.cam.lookAt[1], slide.cam.lookAt[2]);
      }
    }

    let hoveredPartId = null;

    function setupPointerControls(domEl) {
      let downX = 0, downY = 0;

      domEl.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;
        if (e.button === 2 || e.shiftKey) {
          orbit.isPanning = true;
        } else {
          orbit.isDragging = true;
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (orbit.isDragging) {
          const dx = e.clientX - orbit.prevX;
          const dy = e.clientY - orbit.prevY;
          orbit.prevX = e.clientX;
          orbit.prevY = e.clientY;
          orbit.targetTheta -= dx * 0.007;
          orbit.targetPhi = Math.max(0.25, Math.min(Math.PI * 0.85, orbit.targetPhi - dy * 0.007));
        } else if (orbit.isPanning) {
          const dx = e.clientX - orbit.prevX;
          const dy = e.clientY - orbit.prevY;
          orbit.prevX = e.clientX;
          orbit.prevY = e.clientY;
          orbit.targetLookAt.x -= dx * 0.01;
          orbit.targetLookAt.y += dy * 0.01;
        }

        // Hover Raycasting
        const rect = domEl.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const visibleMeshes = clickableMeshes.filter(m => {
          let p = m.parent;
          while (p) { if (!p.visible) return false; p = p.parent; }
          return true;
        });

        const hits = raycaster.intersectObjects(visibleMeshes, false);
        const tooltip = document.getElementById('hover-tooltip');

        if (hits.length > 0) {
          const pid = hits[0].object.userData.partId;
          const slideMatch = SLIDE_DECKS[currentMode].find(s => s.partId === pid);
          if (slideMatch) {
            hoveredPartId = pid;
            domEl.style.cursor = 'pointer';
            tooltip.style.left = `${e.clientX}px`;
            tooltip.style.top = `${e.clientY}px`;
            document.getElementById('tooltip-text').textContent = slideMatch.title;
            if (slideMatch.color) document.getElementById('tooltip-dot').style.backgroundColor = slideMatch.color;
            tooltip.classList.remove('hidden');
            return;
          }
        }

        hoveredPartId = null;
        domEl.style.cursor = orbit.isDragging ? 'grabbing' : 'grab';
        tooltip.classList.add('hidden');
      });

      window.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        if (dist < 6 && hoveredPartId && e.target === domEl) {
          const idx = SLIDE_DECKS[currentMode].findIndex(s => s.partId === hoveredPartId);
          if (idx !== -1) {
            if (!isDrawerOpen) toggleSlideDrawer(true);
            goToSlide(idx);
          }
        }
        orbit.isDragging = false;
        orbit.isPanning = false;
      });

      domEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        orbit.targetRadius = Math.max(3.2, Math.min(22, orbit.targetRadius + e.deltaY * 0.008));
      }, { passive: false });

      domEl.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // 10. MAIN ANIMATION LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      currentExplode += (targetExplode - currentExplode) * 0.09;

      const activeList = currentMode === 'pc' ? pcParts : (currentMode === 'cpu' ? cpuLayers : archParts);
      activeList.forEach(item => {
        item.group.position.copy(item.basePos).addScaledVector(item.explodeVec, currentExplode);
      });

      spinningFans.forEach(f => {
        if (f.axis === 'z') f.mesh.rotation.z += f.speed * delta;
      });

      dataPulses.forEach(p => {
        p.mesh.visible = showDataPulse && currentMode === 'cpu';
        if (p.mesh.visible) {
          p.t = (p.t + 0.65 * delta) % 1;
          p.mesh.position.lerpVectors(p.start, p.end, p.t);
          p.mesh.position.y += Math.sin(p.t * Math.PI) * 0.14;
        }
      });

      if (autoTourActive) {
        autoTourTimer += delta;
        if (autoTourTimer > 5.5) {
          autoTourTimer = 0;
          nextSlide();
        }
      }

      orbit.updateCamera(camera);
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
